# Development Environment Configuration
base.url=http://localhost:8000
api.timeout=30000
api.retry.count=3
api.retry.delay=1000

# API Endpoints
api.endpoints.signup=/signup
api.endpoints.login=/login
api.endpoints.products=/products
api.endpoints.product.by.id=/product/{id}

# HTTP Configuration
http.connection.timeout=10000
http.socket.timeout=30000
http.max.connections=20
http.max.connections.per.route=10

# Request/Response Configuration
request.content.type=application/json
response.content.type=application/json
request.charset=UTF-8

# Logging Configuration
logging.level=INFO
logging.pattern=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.request.response=true
logging.correlation.id=true

# Test Data Configuration
test.data.cleanup=true
test.data.prefix=test_
test.data.user.domain=testuser.com
test.data.password.length=8

# Report Configuration
report.output.directory=target/cucumber-reports
report.format=html,json,junit
report.title=API Automation Test Results