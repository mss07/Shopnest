# ExtentReports Configuration for Cucumber
extent.reporter.spark.start=true
extent.reporter.spark.out=target/cucumber-reports/extent/ExtentReport.html
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Report metadata
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# Screenshot configuration
screenshot.dir=target/cucumber-reports/screenshots
screenshot.rel.path=../screenshots/

# System info
systeminfo.os=Windows
systeminfo.user=Test Automation
systeminfo.build=1.0.0
systeminfo.AppName=E-commerce API Testing Framework